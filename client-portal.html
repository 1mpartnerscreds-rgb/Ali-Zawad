<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — Ali Zawad Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{
  --ink:#0C1A13; --ink2:#192B1E; --ink3:#0A1410;
  --cream:#F6F3EE; --cream2:#ECE9E1; --white:#FDFCFA;
  --brass:#9B7840; --brass2:#C4A263; --brass-lt:rgba(155,120,64,.13); --brass-vlt:rgba(155,120,64,.05);
  --muted:#6A6155; --rule:rgba(155,120,64,.18); --rule2:rgba(155,120,64,.10);
  --shadow:0 2px 8px rgba(12,26,19,.08),0 8px 32px rgba(12,26,19,.06);
  --shadow-lg:0 4px 24px rgba(12,26,19,.14),0 16px 64px rgba(12,26,19,.10);
  --success:#1A6B38; --danger:#8B1A1A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.65;min-height:100vh}
a{color:inherit}

#gate{position:fixed;inset:0;background:var(--ink3);display:flex;align-items:center;justify-content:center;z-index:999;}
.gate-card{background:var(--cream);padding:3rem 2.8rem;width:380px;text-align:center;box-shadow:var(--shadow-lg)}
.gate-card .g-logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;letter-spacing:.08em;margin-bottom:.3rem}
.gate-card .g-logo em{color:var(--brass);font-style:italic}
.gate-sub{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1.6rem}
.gate-inp{width:100%;padding:.8rem 1rem;border:1px solid var(--rule);background:var(--white);margin-bottom:.8rem;font-family:inherit;font-size:.82rem;outline:none}
.gate-inp:focus{border-color:var(--brass)}
.gate-btn{width:100%;padding:.85rem;background:var(--ink);color:var(--cream);border:none;font-size:.65rem;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:.25s;margin-top:.4rem}
.gate-btn:hover{background:var(--brass)}
.gate-btn:disabled{opacity:.5;cursor:default}
.gate-toggle{margin-top:1.4rem;font-size:.68rem;color:var(--muted)}
.gate-toggle span{color:var(--brass);cursor:pointer;text-decoration:underline}
.gate-err{font-size:.68rem;color:var(--danger);margin-top:.6rem;min-height:1em}
.gate-hint{margin-top:1rem;font-size:.64rem;color:var(--muted)}

#portal{display:none;min-height:100vh}
header.topnav{position:sticky;top:0;z-index:50;background:rgba(246,243,238,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding:1.1rem 3rem;display:flex;justify-content:space-between;align-items:center}
.tn-logo{font-family:'Cormorant Garamond',serif;font-size:1.1rem;letter-spacing:.08em;text-decoration:none;color:var(--ink);transition:opacity .2s}
.tn-logo:hover{opacity:.7}
.tn-logo em{color:var(--brass);font-style:italic}
.tn-back{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:.2s}
.tn-back:hover{color:var(--brass)}
.tn-right{display:flex;align-items:center;gap:1.4rem}
.tn-user{font-size:.72rem;color:var(--muted)}
.tn-logout{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);padding:.4rem .9rem;cursor:pointer;background:none;transition:.2s}
.tn-logout:hover{color:var(--brass);border-color:var(--brass)}

.wrap{max-width:1080px;margin:0 auto;padding:2.6rem 2rem 5rem}
.hello{font-family:'Cormorant Garamond',serif;font-size:2.3rem;font-weight:400;margin-bottom:.3rem}
.hello em{color:var(--brass);font-style:italic}
.subline{font-size:.82rem;color:var(--muted);margin-bottom:2.4rem}

.empty-state{background:var(--white);border:1px solid var(--rule);padding:2.4rem;text-align:center;color:var(--muted);font-size:.82rem}

.status-card{background:var(--ink3);color:var(--cream);padding:2rem 2.2rem;display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:2rem;box-shadow:var(--shadow-lg)}
.status-card .sc-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,162,99,.6);margin-bottom:.5rem}
.status-card .sc-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin-bottom:.5rem}
.stage-track{display:flex;gap:.4rem;margin-top:1rem}
.stage-pip{flex:1;height:4px;background:rgba(196,162,99,.2);border-radius:2px;overflow:hidden;position:relative}
.stage-pip.done{background:var(--brass2)}
.stage-pip.active{background:rgba(196,162,99,.2)}
.stage-pip.active::after{content:'';position:absolute;inset:0;background:var(--brass2);animation:fillpulse 2s infinite}
@keyframes fillpulse{0%,100%{opacity:.5}50%{opacity:1}}
.stage-names{display:flex;justify-content:space-between;font-size:.55rem;letter-spacing:.08em;color:rgba(246,243,238,.45);text-transform:uppercase;margin-top:.5rem}
.sc-right{display:flex;flex-direction:column;justify-content:center;gap:.6rem}
.sc-stat{display:flex;justify-content:space-between;font-size:.74rem;border-bottom:1px solid rgba(196,162,99,.12);padding-bottom:.5rem}
.sc-stat span:first-child{color:rgba(246,243,238,.5)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:1.3rem;margin-bottom:1.3rem}
.panel{background:var(--white);border:1px solid var(--rule);box-shadow:var(--shadow)}
.panel-head{padding:1.1rem 1.4rem;border-bottom:1px solid var(--rule2);display:flex;justify-content:space-between;align-items:center}
.panel-head h3{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:500}
.panel-body{padding:1.2rem 1.4rem}

.milestone{display:flex;gap:.9rem;padding:.8rem 0;border-bottom:1px solid var(--rule2)}
.milestone:last-child{border-bottom:none}
.m-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule);flex-shrink:0;margin-top:.15rem;display:flex;align-items:center;justify-content:center;font-size:.6rem}
.m-check.done{background:var(--brass);border-color:var(--brass);color:var(--white)}
.m-title{font-size:.8rem;color:var(--ink)}
.m-date{font-size:.65rem;color:var(--muted);margin-top:.1rem}

.msg-row{display:flex;gap:.7rem;margin-bottom:.9rem}
.msg-av{width:28px;height:28px;border-radius:50%;background:var(--brass-lt);color:var(--brass);display:flex;align-items:center;justify-content:center;font-size:.62rem;flex-shrink:0;font-family:'DM Mono',monospace}
.msg-bubble{background:var(--cream2);padding:.6rem .9rem;font-size:.76rem;border-radius:2px;max-width:90%}
.msg-row.me{flex-direction:row-reverse}
.msg-row.me .msg-bubble{background:var(--ink);color:var(--cream)}
.msg-input-row{display:flex;gap:.5rem;margin-top:1rem}
.msg-input-row input{flex:1;padding:.6rem .8rem;border:1px solid var(--rule);font-family:inherit;font-size:.76rem;outline:none}
.msg-input-row input:focus{border-color:var(--brass)}
.msg-send{padding:.6rem 1.2rem;background:var(--ink);color:var(--cream);border:none;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.msg-send:hover{background:var(--brass)}

.inv-row{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--rule2);font-size:.78rem}
.inv-row:last-child{border-bottom:none}
.inv-amt{font-family:'DM Mono',monospace}
.badge{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;padding:.25rem .55rem}
.badge.paid{background:rgba(26,107,56,.1);color:var(--success)}
.badge.due{background:rgba(155,120,64,.12);color:var(--brass)}

.file-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--rule2);font-size:.76rem}
.file-row:last-child{border-bottom:none}
.file-name{display:flex;align-items:center;gap:.6rem}
.file-dl{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);cursor:pointer}

@media(max-width:880px){.status-card{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="g-logo">Ali Zawad <em>/ Studio</em></div>
    <div class="gate-sub" id="gateMode">Client Login</div>
    <input class="gate-inp" id="gateName" placeholder="Full name" style="display:none">
    <input class="gate-inp" id="gateEmail" placeholder="Email address">
    <input class="gate-inp" id="gatePass" type="password" placeholder="Password">
    <button class="gate-btn" id="gateBtn" onclick="handleAuth()">Sign In</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-toggle">
      <span id="toggleLine">Don't have an account? <span onclick="toggleMode()">Sign up</span></span>
    </div>
    <div class="gate-hint">Connect your Supabase project in supabase-config.js to enable real accounts.</div>
  </div>
</div>

<div id="portal">
  <header class="topnav">
    <a href="index.html" class="tn-logo">Ali Zawad <em>/ Studio</em></a>
    <div class="tn-right">
      <a href="index.html" class="tn-back">← Back to site</a>
      <div class="tn-user" id="userLabel"></div>
      <button class="tn-logout" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="wrap">
    <div class="hello">Welcome, <em id="helloName"></em>.</div>
    <div class="subline">Here's where your project stands today.</div>
    <div id="content"></div>
  </div>
</div>

<script>
let sb, currentUser, currentProfile, currentProject;
let isSignup = false;

function initSupabase(){
  if (!SUPABASE_URL.includes('YOUR-PROJECT')) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    document.getElementById('gateErr').textContent = 'Supabase not configured yet — edit supabase-config.js';
  }
}
initSupabase();

function toggleMode(){
  isSignup = !isSignup;
  document.getElementById('gateMode').textContent = isSignup ? 'Create Account' : 'Client Login';
  document.getElementById('gateName').style.display = isSignup ? 'block' : 'none';
  document.getElementById('gateBtn').textContent = isSignup ? 'Sign Up' : 'Sign In';
  document.getElementById('toggleLine').innerHTML = isSignup
    ? `Already have an account? <span onclick="toggleMode()">Sign in</span>`
    : `Don't have an account? <span onclick="toggleMode()">Sign up</span>`;
  document.getElementById('gateErr').textContent = '';
}

async function handleAuth(){
  if (!sb) return;
  const email = document.getElementById('gateEmail').value.trim();
  const password = document.getElementById('gatePass').value;
  const fullName = document.getElementById('gateName').value.trim();
  const errEl = document.getElementById('gateErr');
  const btn = document.getElementById('gateBtn');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Email and password required.'; return; }

  btn.disabled = true; btn.textContent = '…';
  try {
    if (isSignup) {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      });
      if (error) throw error;
      errEl.style.color = 'var(--success)';
      errEl.textContent = 'Account created — check your email to confirm, then sign in.';
      toggleMode();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enterPortal(data.user);
    }
  } catch (e) {
    errEl.style.color = 'var(--danger)';
    errEl.textContent = e.message || 'Something went wrong.';
  }
  btn.disabled = false;
  btn.textContent = isSignup ? 'Sign Up' : 'Sign In';
}

async function enterPortal(user){
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = profile;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  document.getElementById('userLabel').textContent = `${profile?.full_name || user.email}${profile?.company ? ' — '+profile.company : ''}`;
  document.getElementById('helloName').textContent = (profile?.full_name || user.email).split(' ')[0];
  await loadProject();
}

async function loadProject(){
  const content = document.getElementById('content');
  const { data: projects } = await sb.from('projects').select('*').eq('client_id', currentUser.id).order('created_at', { ascending: false });
  if (!projects || projects.length === 0) {
    content.innerHTML = `<div class="empty-state">No active project linked to your account yet. Once Ali sets one up, it will appear here.</div>`;
    return;
  }
  currentProject = projects[0];
  const stages = ['discovery','design','build','delivered'];
  const stageIdx = stages.indexOf(currentProject.stage);

  const [{ data: milestones }, { data: messages }, { data: invoices }, { data: files }] = await Promise.all([
    sb.from('milestones').select('*').eq('project_id', currentProject.id).order('sort_order'),
    sb.from('messages').select('*').eq('project_id', currentProject.id).order('created_at'),
    sb.from('invoices').select('*').eq('project_id', currentProject.id),
    sb.from('project_files').select('*').eq('project_id', currentProject.id)
  ]);

  content.innerHTML = `
    <div class="status-card">
      <div>
        <div class="sc-label">Project</div>
        <div class="sc-title">${currentProject.title}</div>
        <div class="stage-track">
          ${stages.map((s,i)=>`<div class="stage-pip ${i<stageIdx?'done':i===stageIdx?'active':''}"></div>`).join('')}
        </div>
        <div class="stage-names"><span>Discovery</span><span>Design</span><span>Build</span><span>Delivery</span></div>
      </div>
      <div class="sc-right">
        <div class="sc-stat"><span>Current phase</span><span>${currentProject.stage} — ${currentProject.progress}%</span></div>
        <div class="sc-stat"><span>Target delivery</span><span>${currentProject.target_delivery || 'TBD'}</span></div>
        <div class="sc-stat"><span>Account manager</span><span>Ali Zawad</span></div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><h3>Milestones</h3></div>
        <div class="panel-body">${(milestones||[]).map(m=>`
          <div class="milestone">
            <div class="m-check ${m.done?'done':''}">${m.done?'✓':''}</div>
            <div><div class="m-title">${m.title}</div><div class="m-date">${m.due_date||''}</div></div>
          </div>`).join('') || '<div style="font-size:.74rem;color:var(--muted)">No milestones yet.</div>'}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Messages</h3></div>
        <div class="panel-body">
          <div id="msgList">${renderMsgs(messages||[])}</div>
          <div class="msg-input-row">
            <input id="msgInput" placeholder="Message Ali…">
            <button class="msg-send" onclick="sendMsg()">Send</button>
          </div>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><h3>Invoices</h3></div>
        <div class="panel-body">${(invoices||[]).map(i=>`
          <div class="inv-row"><span>${i.label}</span>
            <span style="display:flex;align-items:center;gap:.7rem">
              <span class="inv-amt">$${(i.amount_cents/100).toLocaleString()}</span>
              <span class="badge ${i.status}">${i.status}</span>
            </span></div>`).join('') || '<div style="font-size:.74rem;color:var(--muted)">No invoices yet.</div>'}</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Shared Files</h3></div>
        <div class="panel-body">${(files||[]).map(f=>`
          <div class="file-row"><div class="file-name">📄 ${f.file_name}</div>
            <div class="file-dl" onclick="downloadFile('${f.storage_path}')">Download</div></div>`).join('') || '<div style="font-size:.74rem;color:var(--muted)">No files shared yet.</div>'}</div>
      </div>
    </div>`;
}

function renderMsgs(messages){
  return messages.map(m=>`
    <div class="msg-row ${m.sender_id===currentUser.id?'me':''}">
      <div class="msg-av">${m.sender_id===currentUser.id ? (currentProfile?.full_name||'Y').slice(0,2).toUpperCase() : 'AZ'}</div>
      <div class="msg-bubble">${m.body}</div>
    </div>`).join('');
}

async function sendMsg(){
  const inp = document.getElementById('msgInput');
  const val = inp.value.trim();
  if(!val || !currentProject) return;
  inp.value = '';
  await sb.from('messages').insert({ project_id: currentProject.id, sender_id: currentUser.id, body: val });
  const { data: messages } = await sb.from('messages').select('*').eq('project_id', currentProject.id).order('created_at');
  document.getElementById('msgList').innerHTML = renderMsgs(messages||[]);
}

async function downloadFile(path){
  const { data } = await sb.storage.from('project-files').createSignedUrl(path, 60);
  if (data?.signedUrl) window.open(data.signedUrl, '_blank');
}

async function logout(){
  await sb.auth.signOut();
  document.getElementById('portal').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
}

// Restore session on page load
(async () => {
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  if (data?.session?.user) await enterPortal(data.session.user);
})();
</script>
</body>
</html>
